services:
  frontend:
    container_name: staffing-ai-frontend
    build:
      context: ./
      dockerfile: ./docker/node/Dockerfile
      target: dev
    ports:
      - "3000:3000"
    volumes:
      - ./source/frontend:/usr/src/app
    tty: true
  backend:
    container_name: staffing-ai-backend
    build:
      context: ./
      dockerfile: ./docker/python/Dockerfile
      target: dev
    ports:
      - "8000:8000"
    volumes:
      - ./source/backend:/usr/src/app
    depends_on:
      - db
    tty: true
  db:
    container_name: staffing-ai-db
    image: postgres:16
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgre/initdb.d:/docker-entrypoint-initdb.d
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - TZ=Asia/Tokyo
    restart: always
  redis:
    container_name: staffing-ai-redis
    image: redis:latest
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
  ses:
    container_name: staffing-ai-ses
    build: 
      context: ./
      dockerfile: ./docker/ses/Dockerfile
    ports:
      - "8005:8005"
volumes:
  postgres_data:
  redis_data: